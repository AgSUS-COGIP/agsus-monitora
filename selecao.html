<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Painel de seleção — MONITORA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400..900&display=swap"
      rel="stylesheet"
    />
    <!-- O mesmo desenho do painel de análises (analises.html): os mesmos CSS de
         src/analises/; os outros entram por src/selecao/main.jsx, na mesma ordem. -->
    <link rel="stylesheet" href="/src/analises/analises.css" />
    <link rel="stylesheet" href="/src/analises/analises-layout-modern.css" />
  </head>
  <body>
    <!-- Etapas do carregamento, só para o leitor de tela: na tela, o próprio
         painel vira o skeleton (src/analises/analises-loading-feedback.js). -->
    <div id="loading" class="loading" role="status" aria-live="polite">
      <span id="loadingTitle">Carregando painel</span>
      <span id="loadingText">Preparando dados...</span>
    </div>

    <div
      class="toast-host"
      id="toastHost"
      aria-live="polite"
      aria-atomic="false"
    ></div>

    <!-- Cabeçalho, filtros, KPIs, gráficos, tabela e gaveta: src/componentes/selecao/. -->
    <div id="selecaoPainel"></div>

    <script type="module" src="/src/selecao/main.jsx"></script>
  </body>
</html>
