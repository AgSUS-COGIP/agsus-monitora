name: Conferências de consistência

# Job Python (scripts/conferencias/conferencias.py) que lê o banco pelas RPCs
# de leitura (conferencia_ler_*, só service_role), confere regras que
# atravessam Análises, Entrevistas, Classificação, Lista de aprovados e as
# cargas da Empregare e grava AVISOS (TB_AVISO_CONFERENCIA). Só leitura dos
# dados de negócio: não muda análise, entrevista, lista nem aprovado.
#
# Primeiro chama contratacao-dos-aprovados.yml ("Contratado em outra lista"), que decide qual
# linha é a contratação quando a mesma matrícula está Contratado em duas listas do edital.
#
# Quando roda:
#   - todo dia às 6h de Brasília (9h UTC), pedido pelo banco (pg_cron → workflow_dispatch
#     com disparado_por = AGENDA; docs/agenda-dos-robos.md; sem `schedule` aqui);
#   - pelo "Rodar agora" das Configurações › Status das atualizações
#     (RPC disparar_robo, só administrador global; disparado_por = id do usuário);
#   - pelo botão "Run workflow" desta aba Actions.
# Guia: docs/python-no-monitora.md. Migration: 20261005210000_conferencias_de_consistencia.sql.
#
# O REPOSITÓRIO É PÚBLICO e este log também: o job só imprime contagens,
# códigos de conferência e números de edital (python/monitora/mascaramento.py).
#
# Secrets do repositório (os mesmos das sincronizações e do robô):
#   SUPABASE_URL                 https://<projeto>.supabase.co
#   SUPABASE_SERVICE_ROLE_KEY    chave service_role do Supabase
# Variável opcional do repositório (Settings → Variables):
#   CONFERENCIA_DIAS_CONVOCADO   dias de "Convocado" sem desfecho até avisar (padrão 15)

on:
  workflow_dispatch:
    inputs:
      modo:
        description: "normal = confere e grava os avisos; seco = só confere e mostra o resumo"
        type: choice
        options:
          - normal
          - seco
        default: normal
      disparado_por:
        description: "Rodar agora do MONITORA = id do usuário; agenda do banco = AGENDA; em branco = GitHub"
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: conferencias
  cancel-in-progress: false

jobs:
  # Antes das conferências, o "Contratado em outra lista" (migration 20261024120000): a conferência
  # dos aprovados já lê as decisões do dia. Falhou? As conferências rodam do mesmo jeito.
  contratacao:
    name: Contratado em outra lista
    uses: ./.github/workflows/contratacao-dos-aprovados.yml
    with:
      modo: ${{ inputs.modo || 'normal' }}
      disparado_por: ${{ inputs.disparado_por }}
    secrets:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  conferir:
    name: Banco → avisos
    needs: contratacao
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Baixar código
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          show-progress: false

      # Só biblioteca padrão (python/monitora/ e scripts/conferencias/): sem pip install.
      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Execução iniciada direto no GitHub: registra no MONITORA (Status das
      # atualizações) com quem a iniciou (migration 20261020170000). Nunca derruba o job.
      - name: Registrar a execução no MONITORA
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PYTHONPATH: python
          ATOR_GITHUB: ${{ github.triggering_actor }}
          DISPARADO_POR: ${{ inputs.disparado_por }}
          MODO: ${{ inputs.modo || 'normal' }}
        run: python -m monitora.disparo_externo conferencias.yml

      # Os inputs vão por variável de ambiente (nunca interpolados no shell).
      - name: Conferir
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CONFERENCIA_DIAS_CONVOCADO: ${{ vars.CONFERENCIA_DIAS_CONVOCADO }}
          MODO: ${{ inputs.modo || 'normal' }}
          DISPARADO_POR: ${{ inputs.disparado_por }}
        run: |
          if [ "$MODO" = "seco" ]; then
            python scripts/conferencias/conferencias.py --seco
          else
            python scripts/conferencias/conferencias.py
          fi
