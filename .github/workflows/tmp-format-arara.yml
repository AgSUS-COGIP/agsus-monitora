name: Temp Format Arara

on:
  push:
    branches:
      - feat/arara-conversa-natural

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: feat/arara-conversa-natural
      - name: Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Dependencias
        run: npm install --no-audit --no-fund
      - name: Prettier
        run: npx prettier --write src/modules/arara-speaking-effects.js src/styles/arara-guide.css tests/arara-speaking-effects.test.js
      - name: Commit
        run: |
          if git diff --quiet; then
            echo "Nenhuma alteracao de formatacao necessaria."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/arara-speaking-effects.js src/styles/arara-guide.css tests/arara-speaking-effects.test.js
          git commit -m "style(arara): aplicar Prettier"
          git push origin HEAD:feat/arara-conversa-natural
