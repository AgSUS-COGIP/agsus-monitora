name: Temporary Aya formatter

on:
  push:
    branches:
      - feat/aya-ollama-local

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Configurar Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Formatar arquivos da Aya
        run: >-
          npx prettier --write
          api/aya.js
          src/modules/aya-ai-client.js
          src/modules/aya-knowledge.js
          src/modules/aya-page-context.js
          tests/aya-ai-client.test.js

      - name: Commitar formatacao
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Nenhuma alteracao de formatacao necessaria."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/aya.js src/modules/aya-ai-client.js src/modules/aya-knowledge.js src/modules/aya-page-context.js tests/aya-ai-client.test.js
          git commit -m "style(aya): formatar arquivos com Prettier"
          git push
