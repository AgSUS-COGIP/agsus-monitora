name: Classificação em Python

# Job Python (scripts/classificacao/classificacao.py --desempate) que prepara o
# RELATÓRIO DE DESEMPATE de cada lista gerada na Classificação: lê a lista
# registrada e o edital pelas RPCs do service_role, calcula a lista de novo
# com o Python (python/monitora/classificacao/) e, só se o retrato calculado
# for igual ao registrado, grava o relatório (classificacao_gravar_desempate,
# que confere o hash da lista de novo). Senão marca a lista como "não confere".
#
# Quando roda:
#   - sozinho, quando alguém gera uma lista em Classificação › Listas: o banco
#     pede (registrar_lista_classificacao → FC_DISPARAR_ROBO, disparado_por = id
#     de quem gerou, listas = a lista), salvo com a chave "Classificação em
#     Python" desligada (Configurações › Automação);
#   - pelo botão "Run workflow" desta aba Actions (listas = ids separados por
#     vírgula, opcional).
# Cada execução leva também todas as listas que esperam o relatório (o GitHub
# guarda uma execução só na fila do grupo; a mais nova substitui a que esperava).
# Guia: docs/python-no-monitora.md. Migration: 20261023170000_classificacao_em_python_etapa_2.sql.
#
# O REPOSITÓRIO É PÚBLICO e este log também: o job só imprime número do edital,
# tipo e id curto da lista, contagens e o caminho das diferenças — nunca nome,
# nota ou valor (os nomes reais chegam ao job só para o cálculo).
#
# Secrets do repositório (os mesmos das sincronizações e do robô):
#   SUPABASE_URL                 https://<projeto>.supabase.co
#   SUPABASE_SERVICE_ROLE_KEY    chave service_role do Supabase

on:
  workflow_dispatch:
    inputs:
      modo:
        description: "desempate = prepara o relatório de desempate das listas geradas"
        type: choice
        options:
          - desempate
        default: desempate
      listas:
        description: "ids das listas (separados por vírgula); em branco = só as que esperam"
        type: string
        required: false
        default: ""
      disparado_por:
        description: "Gerar lista no MONITORA = id do usuário; em branco = GitHub"
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: classificacao
  cancel-in-progress: false

jobs:
  desempate:
    name: Listas geradas → relatório de desempate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Baixar código
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          show-progress: false

      # Só biblioteca padrão (python/monitora/ e scripts/classificacao/): sem pip install.
      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Os inputs vão por variável de ambiente (nunca interpolados no shell).
      - name: Preparar os relatórios
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LISTAS: ${{ inputs.listas }}
          DISPARADO_POR: ${{ inputs.disparado_por }}
        run: |
          if [ -n "$LISTAS" ]; then
            python scripts/classificacao/classificacao.py --desempate --lista "$LISTAS"
          else
            python scripts/classificacao/classificacao.py --desempate
          fi
