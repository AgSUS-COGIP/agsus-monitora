name: Arquivar resultado oficial 95-2026
on:
  push:
    branches: [codex/importacao95-20261118]
    paths: [.github/workflows/importacao95-20261118.yml]
permissions:
  contents: read
jobs:
  arquivo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enviar e conferir XLSX do pedido autorizado
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        shell: python
        run: |
          import os, json, urllib.request, urllib.error, base64, hashlib, io, zipfile
          base = os.environ["SUPABASE_URL"].rstrip("/")
          assert base == "https://tabmkiokfuxyqjuvfiha.supabase.co", "Projeto divergente"
          key = os.environ["SUPABASE_SERVICE_ROLE_KEY"]
          headers = {"apikey": key, "Authorization": "Bearer " + key}
          pedido = "74abe1ac-f8f4-4e82-a0a9-a9d797ef6356"
          edital = "8eb80bff-2400-402e-9eb8-adde2cfc0010"
          expected = "81e575fc40a3a84c8514685261e255552bc0956521a570ad1028687ef6dd7d04"
          route = "/rest/v1/TB_PEDIDO_CASAMENTO_LISTA?CO_PEDIDO=eq." + pedido + "&select=CO_MONITORAMENTO,TP_SITUACAO,DS_NOVOS,DS_PLANO"
          with urllib.request.urlopen(urllib.request.Request(base+route, headers=headers), timeout=45) as response:
              data = json.load(response)
          assert len(data) == 1, "Pedido ausente"
          row = data[0]
          assert row["CO_MONITORAMENTO"] == edital and row["TP_SITUACAO"] == "CALCULADO", "Pedido divergente"
          assert len(row["DS_NOVOS"]) == 166, "Total divergente"
          plan = row["DS_PLANO"]
          content = base64.b64decode(plan["arquivo_xlsx_base64"], validate=True)
          assert hashlib.sha256(content).hexdigest() == expected == plan["arquivo_sha256"], "Hash divergente"
          with zipfile.ZipFile(io.BytesIO(content)) as archive:
              assert "xl/workbook.xml" in archive.namelist()
              assert archive.testzip() is None, "XLSX corrompido"
          path = edital + "/20261118-resultado-final-95-2026.xlsx"
          upload_headers = dict(headers, **{"Content-Type": "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet", "x-upsert": "false"})
          request = urllib.request.Request(base+"/storage/v1/object/listas-aprovados/"+path, data=content, headers=upload_headers, method="POST")
          try:
              with urllib.request.urlopen(request, timeout=45) as response:
                  assert response.status in (200,201), "Envio recusado"
          except urllib.error.HTTPError as error:
              if error.code not in (400,409):
                  raise RuntimeError("Falha no envio: HTTP " + str(error.code)) from None
          check = urllib.request.Request(base+"/storage/v1/object/authenticated/listas-aprovados/"+path, headers=headers)
          with urllib.request.urlopen(check, timeout=45) as response:
              saved = response.read()
          assert hashlib.sha256(saved).hexdigest() == expected, "Arquivo armazenado divergente"
          print("XLSX arquivado e relido: 166 candidatos; SHA-256 conferido.")
