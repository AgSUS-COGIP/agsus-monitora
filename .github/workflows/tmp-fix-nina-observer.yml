name: Temp Fix Nina Observer

on:
  push:
    branches:
      - feat/arara-conversa-inteligente

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: feat/arara-conversa-inteligente
      - name: Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Dependencias
        run: npm ci --no-audit --no-fund
      - name: Corrigir observer
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'src/modules/arara-speaking-effects.js';
          let src = fs.readFileSync(path, 'utf8');
          const before = `function observeHost(host) {
            if (!host || hostObservers.has(host)) return;

            const win = host.ownerDocument.defaultView || window;
            const Observer = win.MutationObserver;
            if (!Observer) return;

            const observer = new Observer(() => processAssistantMessages(host));
            observer.observe(host, { childList: true, subtree: true });
            hostObservers.set(host, observer);
            processAssistantMessages(host);
          }`;
          const after = `function observeHost(host) {
            if (!host || hostObservers.has(host)) return;

            const win = host.ownerDocument.defaultView || window;
            const Observer = win.MutationObserver;
            if (!Observer) return;

            const observeOptions = { childList: true, subtree: true };
            let observer;
            const processWithoutSelfObservation = () => {
              observer.disconnect();
              processAssistantMessages(host);
              observer.observe(host, observeOptions);
            };

            observer = new Observer(processWithoutSelfObservation);
            hostObservers.set(host, observer);
            processWithoutSelfObservation();
          }`;
          if (src.includes(after)) {
            console.log('Observer ja corrigido.');
          } else if (src.includes(before)) {
            src = src.replace(before, after);
            fs.writeFileSync(path, src);
          } else {
            throw new Error('Bloco observeHost esperado nao encontrado');
          }
          NODE
      - name: Prettier
        run: npx prettier --write src/modules/arara-speaking-effects.js
      - name: Teste Nina
        run: npx vitest run tests/arara-speaking-effects.test.js
      - name: Commit
        run: |
          if git diff --quiet; then
            echo "Nenhuma alteracao necessaria."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/arara-speaking-effects.js
          git commit -m "fix(nina): evitar loop do MutationObserver"
          git push origin HEAD:feat/arara-conversa-inteligente
