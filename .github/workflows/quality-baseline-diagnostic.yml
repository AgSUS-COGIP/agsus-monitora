name: Temporary Quality Baseline Diagnostic

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          show-progress: false

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Instalar dependências
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund @vitest/coverage-v8@4 eslint@9 @eslint/js@9 globals@16 prettier@3

      - name: Inventariar testes
        run: find tests -type f -maxdepth 4 -print | sort

      - name: Medir cobertura atual
        continue-on-error: true
        run: npx vitest run --coverage.enabled=true --coverage.provider=v8 --coverage.reporter=text --coverage.reporter=json-summary --coverage.reportsDirectory=coverage-diagnostic

      - name: Criar configuração ESLint diagnóstica
        run: |
          cat > eslint.diagnostic.config.mjs <<'EOF'
          import js from "@eslint/js";
          import globals from "globals";

          export default [
            {
              ignores: ["dist/**", "coverage*/**", "node_modules/**"]
            },
            js.configs.recommended,
            {
              files: ["src/lib/**/*.js", "scripts/**/*.mjs", "tests/**/*.js", "vite.config.js"],
              languageOptions: {
                ecmaVersion: "latest",
                sourceType: "module",
                globals: {
                  ...globals.browser,
                  ...globals.node
                }
              },
              rules: {
                "no-unused-vars": ["warn", { "argsIgnorePattern": "^_", "varsIgnorePattern": "^_" }]
              }
            }
          ];
          EOF

      - name: Medir lint atual
        continue-on-error: true
        run: npx eslint src/lib scripts tests vite.config.js --config eslint.diagnostic.config.mjs

      - name: Medir formatação atual
        continue-on-error: true
        run: npx prettier --check package.json vite.config.js vercel.json "scripts/**/*.mjs" "src/lib/**/*.js" "tests/**/*.js"
