name: Temporary Map PR38 formatter

on:
  push:
    branches:
      - fix/mapa-cnes-terras-indigenas

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Configurar Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Formatar arquivos do mapa
        run: >-
          npx prettier --write
          src/modules/lotacoes-geograficas-transport.js
          tests/lotacoes-geograficas.test.js

      - name: Commitar formatacao
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Nenhuma alteracao de formatacao necessaria."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/lotacoes-geograficas-transport.js tests/lotacoes-geograficas.test.js
          git commit -m "style(mapa): aplicar Prettier no PR 38"
          git push
