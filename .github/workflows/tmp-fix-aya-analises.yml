name: Temp Fix Aya Analises

on:
  push:
    branches:
      - fix/aya-analises-smoke

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: fix/aya-analises-smoke

      - name: Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Ajustar fala
        run: |
          node <<'NODE'
          const fs = require('fs');
          const files = [
            'src/modules/arara-guide.js',
            'src/modules/arara-speaking-effects.js',
          ];
          for (const path of files) {
            let source = fs.readFileSync(path, 'utf8');
            source = source.replaceAll('em Análises curriculares', 'em análises curriculares');
            fs.writeFileSync(path, source);
          }
          NODE

      - name: Dependencias
        run: npm install --no-audit --no-fund

      - name: Prettier
        run: npx prettier --check src/modules/arara-guide.js src/modules/arara-speaking-effects.js

      - name: Testes direcionados
        run: npx vitest run tests/arara-guide.test.js tests/arara-speaking-effects.test.js tests/section-guide-integration.test.js

      - name: Remover workflow e commitar
        run: |
          rm .github/workflows/tmp-fix-aya-analises.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/arara-guide.js src/modules/arara-speaking-effects.js .github/workflows/tmp-fix-aya-analises.yml
          git commit -m "fix(aya): alinhar fala de análises ao smoke"
          git push origin HEAD:fix/aya-analises-smoke
