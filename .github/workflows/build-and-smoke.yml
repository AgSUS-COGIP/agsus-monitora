name: AgSUS Monitora Quality Gate

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quality-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Formatar retrato institucional
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar código da branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 2

      - name: Configurar Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Formatar e restaurar workflow
        run: |
          npx prettier --write src/lib/avatar-config.js
          git checkout origin/main -- .github/workflows/build-and-smoke.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/avatar-config.js .github/workflows/build-and-smoke.yml
          git commit -m "formata retrato institucional"
          git push
