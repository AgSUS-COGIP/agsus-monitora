name: AgSUS Monitora Quality Gate

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Arquitetura, qualidade, build e smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Baixar código
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          show-progress: false

      - name: Configurar Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Verificar workflows
        run: npm run check:workflows

      - name: Verificar arquitetura Supabase Auth
        run: npm run check:auth-architecture

      - name: Baixar base das verificações incrementais
        run: git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main

      - name: Verificar arquitetura DOM
        run: node scripts/check-no-new-mutation-observer.mjs

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Verificar lint
        run: npm run lint

      - name: Verificar formatação alterada
        run: npm run format:check

      - name: Empacotar formatação canônica
        uses: actions/upload-artifact@v4
        with:
          name: profile-avatar-formatted
          path: |
            src/lib/avatar-config.js
            src/modules/profile-avatar.js
            src/styles/profile-avatar.css
            tests/avatar-config.test.js
          if-no-files-found: error

      - name: Testes e cobertura
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Instalar navegador do Playwright
        run: npx playwright install --with-deps chromium

      - name: Smoke tests
        run: npm run test:smoke
