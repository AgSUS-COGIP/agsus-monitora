name: AgSUS Monitora Quality Gate

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Arquitetura, qualidade, build e smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Baixar código
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          show-progress: false

      - name: Configurar Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Verificar workflows
        run: npm run check:workflows

      - name: Verificar arquitetura Supabase Auth
        run: npm run check:auth-architecture

      - name: Baixar base das verificações incrementais
        run: git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main

      # Migration nova com timestamp que a main já usa só quebrava a main depois
      # do merge (05/11: 20261105190000). Compara com a ponta da main baixada acima.
      - name: Verificar timestamps das migrations
        run: npm run check:migrations

      - name: Verificar arquitetura DOM
        run: node scripts/check-no-new-mutation-observer.mjs

      - name: Verificar que não há novos remendos
        run: node scripts/check-no-new-patch-layers.mjs

      - name: Verificar que o legado só encolhe
        run: node scripts/check-legado-so-encolhe.mjs

      - name: Instalar dependências
        run: npm ci --no-audit --no-fund

      - name: Verificar lint
        run: npm run lint

      - name: Verificar formatação alterada
        run: npm run format:check

      - name: Testes e cobertura
        run: npm run test:coverage

      # O Supabase deste build é fictício: os testes de navegador respondem a ele
      # por page.route (tests/sessao-simulada.spec.js). Não é segredo nem banco real.
      - name: Build
        env:
          VITE_SUPABASE_URL: https://teste.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: chave-publicavel-de-teste
        run: npm run build

      - name: Ler versão do Playwright
        id: playwright
        run: echo "versao=$(npx playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"

      - name: Guardar navegador do Playwright
        id: navegador
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.versao }}

      - name: Instalar navegador do Playwright
        if: steps.navegador.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Instalar dependências do navegador
        if: steps.navegador.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # Todos os *.spec.js contra o dist/ do passo Build (sem compilar de novo);
      # os que precisam de banco de desenvolvimento são pulados.
      - name: Testes de navegador
        env:
          PLAYWRIGHT_DIST_PRONTO: "1"
        run: npm run test:e2e

      - name: Smoke no servidor TypeScript
        env:
          PLAYWRIGHT_DIST_PRONTO: "1"
        run: npm run test:smoke:servidor -- tests/sessao-simulada.spec.js

      - name: Verificar imagem de implantação
        run: docker build -t monitora:ci .

      - name: Executar aplicação no container
        run: |
          docker run -d --name monitora-ci -p 8000:8000 monitora:ci
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8000/up > /dev/null; then exit 0; fi
            sleep 1
          done
          docker logs monitora-ci
          exit 1

      - name: Smoke contra o container
        env:
          PLAYWRIGHT_REUSE_SERVER: "1"
        run: npm run test:smoke:servidor

      - name: Encerrar container de teste
        if: always()
        run: docker rm -f monitora-ci || true

      - name: Guardar relatório do Playwright
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: relatorio-do-playwright
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  python:
    name: Python (ruff e pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar código
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          show-progress: false

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            python/requirements-dev.txt
            scripts/robo-empregare/requirements.txt

      # Ferramentas (ruff, pytest) e as bibliotecas que os testes do robô leem
      # (pandas/openpyxl). Nada disso vai para a Vercel. Guia: docs/python-no-monitora.md.
      - name: Instalar dependências
        run: pip install --disable-pip-version-check -r python/requirements-dev.txt -r scripts/robo-empregare/requirements.txt

      - name: Lint (ruff check)
        run: ruff check --output-format=github .

      - name: Formatação (ruff format)
        run: ruff format --check .

      - name: Testes (pytest)
        run: python -m pytest

  contrato-rpc-banco:
    name: Contrato de RPC contra o banco de desenvolvimento
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar código
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          show-progress: false

      - name: Configurar Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Instalar dependências
        run: npm ci --no-audit --no-fund

      - name: Verificar contrato contra o catálogo
        # SUPABASE_DB_URL_DEV aponta para o Supabase de DESENVOLVIMENTO, nunca para
        # produção, e nunca é variável VITE_*: essas entram no bundle do navegador.
        # Sem o segredo configurado o passo é ignorado, não falha: a verificação
        # estática do contrato já corre no build, no job anterior.
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL_DEV }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "Segredo SUPABASE_DB_URL_DEV não configurado; verificação viva ignorada."
            exit 0
          fi
          npm run check:rpc-contract:db
