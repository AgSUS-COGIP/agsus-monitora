name: AgSUS Monitora Quality Gate

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Arquitetura, qualidade, build e smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Informar o escopo da validacao do banco
        if: github.event_name != 'workflow_dispatch' || github.ref != 'refs/heads/main'
        run: |
          echo '### Banco de desenvolvimento' >> "$GITHUB_STEP_SUMMARY"
          echo 'Contrato RPC real: NAO EXECUTADO nesta rodada. Os testes de navegador usam dados simulados.' >> "$GITHUB_STEP_SUMMARY"
          echo 'A verificacao real exige execucao manual na main e SUPABASE_DB_URL_DEV configurada.' >> "$GITHUB_STEP_SUMMARY"

      - name: Baixar código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          show-progress: false

      - name: Configurar Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24

      - name: Verificar workflows
        run: npm run check:workflows

      - name: Verificar arquitetura Supabase Auth
        run: npm run check:auth-architecture

      - name: Baixar base das verificações incrementais
        run: git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main

      # Migration nova com timestamp que a main já usa só quebrava a main depois
      # do merge (05/11: 20261105190000). Compara com a ponta da main baixada acima.
      - name: Verificar timestamps das migrations
        run: npm run check:migrations

      - name: Verificar arquitetura DOM
        run: node scripts/check-no-new-mutation-observer.mjs

      - name: Verificar que não há novos remendos
        run: node scripts/check-no-new-patch-layers.mjs

      - name: Verificar que o legado só encolhe
        run: node scripts/check-legado-so-encolhe.mjs

      - name: Instalar dependências
        run: npm ci --no-audit --no-fund

      - name: Verificar lint
        run: npm run lint

      - name: Verificar formatação alterada
        run: npm run format:check

      - name: Testes e cobertura
        run: npm run test:coverage

      # O Supabase deste build é fictício: os testes de navegador respondem a ele
      # por page.route (tests/sessao-simulada.spec.js). Não é segredo nem banco real.
      - name: Build
        env:
          VITE_SUPABASE_URL: https://teste.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: chave-publicavel-de-teste
        run: npm run build

      - name: Ler versão do Playwright
        id: playwright
        run: echo "versao=$(npx playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"

      - name: Guardar navegador do Playwright
        id: navegador
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.versao }}

      # Plano B (11/11/2026): com o espelho de pacotes do Ubuntu fora do ar, o apt
      # do --with-deps/install-deps falhava e derrubava o CI de todos os PRs. O
      # servidor do GitHub já traz as bibliotecas do Chromium; sem o apt, segue com
      # um aviso e o smoke diz se faltou alguma.
      - name: Instalar navegador do Playwright
        if: steps.navegador.outputs.cache-hit != 'true'
        run: |
          npx playwright install --with-deps chromium || {
            echo "::warning::apt indisponível: instalando o Chromium sem as dependências do sistema."
            npx playwright install chromium
          }

      - name: Instalar dependências do navegador
        if: steps.navegador.outputs.cache-hit == 'true'
        run: |
          npx playwright install-deps chromium ||
            echo "::warning::apt indisponível: seguindo com as bibliotecas que o servidor já tem."

      # Todos os *.spec.js contra o dist/ do passo Build (sem compilar de novo);
      # os que precisam de banco de desenvolvimento são pulados.
      - name: Testes de navegador
        env:
          PLAYWRIGHT_DIST_PRONTO: "1"
        run: npm run test:e2e

      - name: Smoke no servidor TypeScript
        env:
          PLAYWRIGHT_DIST_PRONTO: "1"
        run: npm run test:smoke:servidor -- tests/sessao-simulada.spec.js

      - name: Verificar imagem de implantação
        run: docker build -t monitora:ci .

      - name: Executar aplicação no container
        run: |
          docker run -d --name monitora-ci -p 8000:8000 monitora:ci
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8000/up > /dev/null; then exit 0; fi
            sleep 1
          done
          docker logs monitora-ci
          exit 1

      - name: Smoke contra o container
        env:
          PLAYWRIGHT_REUSE_SERVER: "1"
        run: npm run test:smoke:servidor

      - name: Encerrar container de teste
        if: always()
        run: docker rm -f monitora-ci || true

      - name: Guardar relatório do Playwright
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: relatorio-do-playwright
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  python:
    name: Python (ruff e pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          show-progress: false

      - name: Configurar Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            python/requirements-dev.txt
            scripts/robo-empregare/requirements.txt

      # Ferramentas (ruff, pytest) e as bibliotecas que os testes do robô leem
      # (pandas/openpyxl). Nada disso vai para a Vercel. Guia: docs/python-no-monitora.md.
      - name: Instalar dependências
        run: pip install --disable-pip-version-check -r python/requirements-dev.txt -r scripts/robo-empregare/requirements.txt

      - name: Lint (ruff check)
        run: ruff check --output-format=github .

      - name: Formatação (ruff format)
        run: ruff format --check .

      - name: Testes (pytest)
        run: python -m pytest

  contrato-rpc-banco:
    name: Contrato de RPC contra o banco de desenvolvimento
    # Credenciais do banco nunca sao entregues ao codigo de um PR.
    # Fora da main manual este job fica SKIPPED, nao aprovado sem consultar.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Exigir a conexao de desenvolvimento
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL_DEV }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo '::error::SUPABASE_DB_URL_DEV ausente; o contrato RPC real nao foi validado.'
            echo 'Contrato RPC real: NAO EXECUTADO por configuracao ausente.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Baixar código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          show-progress: false

      - name: Configurar Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24

      - name: Instalar dependências
        run: npm ci --no-audit --no-fund

      - name: Verificar contrato contra o catálogo
        # Apenas banco de DESENVOLVIMENTO. Nunca usar uma credencial VITE_*.
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL_DEV }}
        run: |
          npm run check:rpc-contract:db
          echo 'Contrato RPC real: EXECUTADO COM SUCESSO no banco de desenvolvimento.' >> "$GITHUB_STEP_SUMMARY"
