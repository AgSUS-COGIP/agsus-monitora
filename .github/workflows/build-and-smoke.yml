name: AgSUS Monitora Quality Gate

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Arquitetura, qualidade, build e smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Baixar código
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          show-progress: false

      - name: Configurar Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Verificar workflows
        run: npm run check:workflows

      - name: Verificar arquitetura Supabase Auth
        run: npm run check:auth-architecture

      - name: Baixar base das verificações incrementais
        run: git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main

      - name: Verificar arquitetura DOM
        run: node scripts/check-no-new-mutation-observer.mjs

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Verificar lint
        run: npm run lint

      - name: Verificar formatação alterada
        run: npm run format:check

      - name: Testes e cobertura
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Instalar navegador do Playwright
        run: npx playwright install --with-deps chromium

      - name: Smoke tests
        run: npm run test:smoke

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: mbstring, xml, curl, zip
          coverage: none

      - name: Instalar Laravel
        run: composer --working-dir=laravel install --no-interaction --prefer-dist

      - name: Preparar páginas e assets do Laravel
        run: node scripts/package-laravel.mjs

      - name: Testes das rotas PHP
        run: npm run test:php

      - name: Smoke no servidor Laravel
        run: npm run test:smoke:laravel

      - name: Verificar imagem de implantação PHP
        run: docker build -t monitora-laravel:ci .

  contrato-rpc-banco:
    name: Contrato de RPC contra o banco de desenvolvimento
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar código
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          show-progress: false

      - name: Configurar Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Verificar contrato contra o catálogo
        # SUPABASE_DB_URL_DEV aponta para o Supabase de DESENVOLVIMENTO, nunca para
        # produção, e nunca é variável VITE_*: essas entram no bundle do navegador.
        # Sem o segredo configurado o passo é ignorado, não falha: a verificação
        # estática do contrato já corre no build, no job anterior.
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL_DEV }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "Segredo SUPABASE_DB_URL_DEV não configurado; verificação viva ignorada."
            exit 0
          fi
          npm run check:rpc-contract:db
