name: AgSUS Monitora Quality Gate

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quality-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Aplicar redesign premium
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar código da branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1

      - name: Configurar Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Aplicar redesign e restaurar workflow
        run: |
          node scripts/apply-premium-avatar.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/avatar-config.js src/modules/profile-avatar.js src/styles/profile-avatar.css tests/avatar-config.test.js tests/profile-avatar.test.js .github/workflows/build-and-smoke.yml scripts/apply-premium-avatar.mjs
          git commit -m "redesenha avatares com estilo institucional"
          git push
