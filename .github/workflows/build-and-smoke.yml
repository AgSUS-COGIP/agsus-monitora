name: AgSUS Monitora Quality Gate

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quality-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Arquitetura, qualidade, build e smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Baixar código da branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          show-progress: false

      - name: Configurar Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Baixar base das verificações incrementais
        run: git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Aplicar formatação e restaurar verificadores
        run: |
          npm run format:check
          git checkout origin/main -- scripts/check-changed-format.mjs .github/workflows/build-and-smoke.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/avatar-config.js src/modules/profile-avatar.js src/styles/profile-avatar.css tests/avatar-config.test.js scripts/check-changed-format.mjs .github/workflows/build-and-smoke.yml
          git commit -m "formata e finaliza estudio de avatar"
          git push origin HEAD:${{ github.head_ref }}
