name: Temp Fix Nina Copy

on:
  push:
    branches:
      - feat/nina-livre-fontes-oficiais

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: feat/nina-livre-fontes-oficiais
      - name: Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Dependencias
        run: npm install --no-audit --no-fund
      - name: Ajustar textos
        run: |
          node <<'NODE'
          const fs = require('fs');

          const guidePath = 'src/modules/arara-guide.js';
          let guide = fs.readFileSync(guidePath, 'utf8');
          guide = guide.replace(
            '"Olá! Eu sou a Nina, assistente do MONITORA. Estou com você em Análises e posso ajudar com filtros, gráfico, fila operacional e leitura do recorte atual. O que você quer entender?"',
            '"Olá! Eu sou a Nina, assistente do MONITORA. Estou com você em Análises curriculares e posso ajudar com filtros, gráfico, fila operacional e leitura do recorte atual. O que você quer entender?"',
          );
          guide = guide.replace(
            '"Use a busca para localizar um registro e abra Detalhes quando precisar conferir as informações completas. Interprete o status sempre dentro dos filtros ativos."',
            '"Na fila operacional, use a busca para localizar um registro e abra Detalhes quando precisar conferir as informações completas. Interprete o status sempre dentro dos filtros ativos."',
          );
          fs.writeFileSync(guidePath, guide);

          const effectsPath = 'src/modules/arara-speaking-effects.js';
          let effects = fs.readFileSync(effectsPath, 'utf8');
          effects = effects.replace(
            '"Olá! Eu sou a Nina. Você está em Análises. Posso te ajudar com os filtros, o gráfico ou a fila operacional. O que você quer entender primeiro?"',
            '"Olá! Eu sou a Nina. Você está em Análises curriculares. Posso te ajudar com os filtros, o gráfico ou a fila operacional. O que você quer entender primeiro?"',
          );
          fs.writeFileSync(effectsPath, effects);
          NODE
      - name: Prettier
        run: npx prettier --write src/modules/arara-guide.js src/modules/arara-speaking-effects.js
      - name: Testes direcionados
        run: npx vitest run tests/arara-guide.test.js tests/section-guide-integration.test.js tests/arara-speaking-effects.test.js
      - name: Commit
        run: |
          if git diff --quiet; then
            echo "Nenhuma alteracao necessaria."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/arara-guide.js src/modules/arara-speaking-effects.js
          git commit -m "fix(nina): alinhar fala contextual de Análises"
          git push origin HEAD:feat/nina-livre-fontes-oficiais
