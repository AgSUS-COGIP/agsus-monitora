name: Pré-classificação da Avaliação documental

# Job Python (scripts/pre_classificacao/pre_classificacao.py) que lê do banco a
# regra da avaliação e os inscritos que o robô da Empregare trouxe (sem nome,
# e-mail, CPF nem telefone), calcula a Lista Provisória por ART e o lote de
# convocação de cada vaga (python/monitora/avaliacao_documental/) e grava o
# resultado pronto pelas RPCs do service_role (TB_PRE_CLASSIFICACAO).
#
# Quando roda:
#   - pelo "Recalcular" da aba Avaliação documental › Pré-classificação (só a
#     coordenação do edital; editais = o id do edital) e pelo "Rodar agora" das
#     Configurações › Status das atualizações (administrador global; todos os
#     editais ativos com vagas da Empregare) — os dois pela RPC disparar_robo,
#     com disparado_por = id do usuário;
#   - sozinho, no fim do robô da Empregare que gravou alguma vaga (job
#     "Pré-classificar" de robo-empregare.yml chama este workflow com
#     workflow_call e apos_robo, para os editais das vagas carregadas);
#   - pelo botão "Run workflow" desta aba Actions (o primeiro passo registra a
#     execução no MONITORA, com quem a iniciou; falha nele só gera aviso).
# Guia: docs/python-no-monitora.md. Migration: 20261006110000_pre_classificacao_e_lote.sql.
#
# Inscrições congeladas (migration 20261020170000): o edital com a trava ligada
# não é recalculado nem tem o lote refeito (pedido em "editais", a execução é
# recusada; sem editais, fica de fora). O seco continua. "forcar_congelado" é o
# token que o MONITORA manda quando o administrador global força, com motivo.
#
# Modo refazer_lote: recorta o lote do zero enquanto ninguém foi analisado e TODAS as
# fichas do edital estão intocadas (pendentes, nunca atribuídas, reservadas, salvas nem
# concluídas). Quem continua no lote mantém a ficha; quem sai fica com a ficha FORA_LOTE
# ("Lote refeito em dd/mm"); quem entra ganha ficha nova. Com ficha iniciada, o edital é
# recusado ("o lote já está em análise: N fichas iniciadas"); o banco confere de novo
# (20261013110000_refazer_lote_com_fichas_intocadas.sql).
#
# O REPOSITÓRIO É PÚBLICO e este log também: o job só imprime contagens,
# códigos de vaga e de aviso e números de edital (python/monitora/mascaramento.py).
#
# Secrets do repositório (os mesmos das sincronizações e do robô):
#   SUPABASE_URL                 https://<projeto>.supabase.co
#   SUPABASE_SERVICE_ROLE_KEY    chave service_role do Supabase

on:
  workflow_dispatch:
    inputs:
      editais:
        description: "Opcional: editais separados por vírgula (93/2026, o id do edital ou, sem número, o nome); vazio = os ativos com vagas da Empregare"
        type: string
        required: false
        default: ""
      modo:
        description: "normal = calcula e grava; seco = só calcula e mostra o resumo; refazer_lote = recorta o lote do zero (só com todas as fichas do edital intocadas)"
        type: choice
        options:
          - normal
          - seco
          - refazer_lote
        default: normal
      disparado_por:
        description: "Preenchido pelo MONITORA (Recalcular ou Rodar agora, id do usuário); em branco = GitHub"
        type: string
        required: false
        default: ""
      forcar_congelado:
        description: "Preenchido pelo MONITORA (liberação do administrador global para edital com inscrições congeladas); deixe em branco"
        type: string
        required: false
        default: ""
  # Fim do robô da Empregare (robo-empregare.yml): os editais das vagas da última carga.
  workflow_call:
    inputs:
      apos_robo:
        type: boolean
        required: false
        default: false
      disparado_por:
        type: string
        required: false
        default: ""
      forcar_congelado:
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  pre_classificar:
    name: Empregare → Provisória e lote
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # No job (e não no topo): vale também quando o robô chama este workflow, sem
    # misturar com o grupo do robô ("empregare").
    concurrency:
      group: pre-classificacao
      cancel-in-progress: false

    steps:
      - name: Baixar código
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          show-progress: false

      # Só biblioteca padrão (python/monitora/ e scripts/pre_classificacao/): sem pip install.
      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Execução iniciada direto no GitHub: registra no MONITORA (Status das
      # atualizações) com quem a iniciou. Nunca derruba o job.
      - name: Registrar a execução no MONITORA
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PYTHONPATH: python
          ATOR_GITHUB: ${{ github.triggering_actor }}
          DISPARADO_POR: ${{ inputs.disparado_por }}
          MODO: ${{ inputs.modo || 'normal' }}
          EDITAIS: ${{ inputs.editais }}
          FORCAR_CONGELADO: ${{ inputs.forcar_congelado }}
        run: python -m monitora.disparo_externo pre-classificacao.yml

      # Os inputs vão por variável de ambiente (nunca interpolados no shell); o
      # script valida o formato de cada um.
      - name: Pré-classificar
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EDITAIS: ${{ inputs.editais }}
          MODO: ${{ inputs.modo || 'normal' }}
          DISPARADO_POR: ${{ inputs.disparado_por }}
          FORCAR_CONGELADO: ${{ inputs.forcar_congelado }}
          APOS_ROBO: ${{ inputs.apos_robo && 'sim' || 'nao' }}
        run: |
          args=()
          if [ "$APOS_ROBO" = "sim" ]; then args+=(--apos-robo); fi
          python scripts/pre_classificacao/pre_classificacao.py "${args[@]}"
