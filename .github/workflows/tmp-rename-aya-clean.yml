name: Temp Rename Aya Clean

on:
  push:
    branches:
      - feat/aya-livre-fontes-oficiais

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: feat/aya-livre-fontes-oficiais
      - name: Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Dependencias
        run: npm install --no-audit --no-fund
      - name: Renomear identidade visivel
        run: |
          files="src/modules/arara-guide.js src/modules/arara-speaking-effects.js tests/arara-guide.test.js tests/arara-speaking-effects.test.js tests/nina-panel-drag.test.js"
          for file in $files; do
            if [ -f "$file" ]; then
              sed -i 's/Nina/Aya/g' "$file"
            fi
          done
      - name: Prettier somente nos arquivos alterados
        run: npx prettier --write src/modules/arara-guide.js src/modules/arara-speaking-effects.js tests/arara-guide.test.js tests/arara-speaking-effects.test.js tests/nina-panel-drag.test.js
      - name: Testes direcionados
        run: npx vitest run tests/arara-guide.test.js tests/section-guide-integration.test.js tests/arara-speaking-effects.test.js tests/nina-panel-drag.test.js
      - name: Garantir nome visivel
        run: |
          if grep -n 'Nina' src/modules/arara-guide.js src/modules/arara-speaking-effects.js tests/arara-guide.test.js tests/arara-speaking-effects.test.js tests/nina-panel-drag.test.js; then
            echo "Ainda existem ocorrencias visiveis de Nina nos arquivos da assistente."
            exit 1
          fi
      - name: Remover workflow temporario e commitar
        run: |
          rm -f .github/workflows/tmp-rename-aya-clean.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/arara-guide.js src/modules/arara-speaking-effects.js tests/arara-guide.test.js tests/arara-speaking-effects.test.js tests/nina-panel-drag.test.js .github/workflows
          git commit -m "feat(aya): renomear assistente visivel"
          git push origin HEAD:feat/aya-livre-fontes-oficiais
