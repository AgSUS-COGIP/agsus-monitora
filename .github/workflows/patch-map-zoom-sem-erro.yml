name: Patch map zoom and fallback

on:
  push:
    branches:
      - fix/mapa-zoom-sem-erro

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mapa-zoom-sem-erro
          fetch-depth: 0

      - name: Harmonize zoom guard and satellite native zoom
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"pattern not found in {path}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          # 500 km na régua sem recortar excessivamente o Brasil: zoom 4.5.
          replace_once(
              'src/modules/map-base-layer-switcher.js',
              '// - zoom 5: limite de afastamento nacional, régua na faixa de 500 km;\n// - zoom 19: aproximação na faixa de dezenas de metros.\nexport const MAP_MIN_ZOOM = 5;\nexport const MAP_MAX_ZOOM = 19;',
              '// - zoom 4.5: limite de afastamento nacional, régua na faixa de 500 km;\n// - zoom 19: aproximação na faixa de dezenas de metros.\nexport const MAP_MIN_ZOOM = 4.5;\nexport const MAP_MAX_ZOOM = 19;\nconst SATELLITE_MAX_NATIVE_ZOOM = 17;'
          )
          replace_once(
              'src/modules/map-base-layer-switcher.js',
              '  const layer = L.tileLayer(SATELLITE_URL, {\n    maxZoom: MAP_MAX_ZOOM,',
              '  const layer = L.tileLayer(SATELLITE_URL, {\n    maxZoom: MAP_MAX_ZOOM,\n    maxNativeZoom: SATELLITE_MAX_NATIVE_ZOOM,'
          )

          # O guard antigo anulava o novo limite depois do whenReady. Alinhar o dono
          # do enquadramento com a mesma escala mínima do switcher.
          replace_once(
              'src/modules/map-guard.js',
              'const SOUTH_AMERICA_MAX_BOUNDS = NAVEGACAO_BOUNDS;\n',
              'const SOUTH_AMERICA_MAX_BOUNDS = NAVEGACAO_BOUNDS;\nconst HEALTH_MAP_MIN_ZOOM = 4.5;\nconst HEALTH_MAP_OVERVIEW_MAX_ZOOM = 4.5;\n'
          )
          replace_once(
              'src/modules/map-guard.js',
              '      const allowed = Number.isFinite(requested) ? Math.min(requested, 3) : 3;\n      return originalSetMinZoom(allowed);\n    };\n    originalSetMinZoom(3);',
              '      const allowed = Number.isFinite(requested)\n        ? Math.max(requested, HEALTH_MAP_MIN_ZOOM)\n        : HEALTH_MAP_MIN_ZOOM;\n      return originalSetMinZoom(allowed);\n    };\n    originalSetMinZoom(HEALTH_MAP_MIN_ZOOM);'
          )
          replace_once(
              'src/modules/map-guard.js',
              '? Math.min(Number.isFinite(requestedMax) ? requestedMax : 4, 4)',
              '? Math.min(\n          Number.isFinite(requestedMax)\n            ? requestedMax\n            : HEALTH_MAP_OVERVIEW_MAX_ZOOM,\n          HEALTH_MAP_OVERVIEW_MAX_ZOOM,\n        )'
          )
          replace_once(
              'src/modules/map-guard.js',
              '? Math.min(options.maxZoom ?? 4, 4)\n          : (options.maxZoom ?? 9),',
              '? Math.min(\n              options.maxZoom ?? HEALTH_MAP_OVERVIEW_MAX_ZOOM,\n              HEALTH_MAP_OVERVIEW_MAX_ZOOM,\n            )\n          : (options.maxZoom ?? 9),'
          )
          replace_once(
              'src/modules/map-guard.js',
              '        maxZoom: 4,\n        animate: false,',
              '        maxZoom: HEALTH_MAP_OVERVIEW_MAX_ZOOM,\n        animate: false,'
          )
          replace_once(
              'src/modules/map-guard.js',
              '    originalSetMinZoom?.(3);',
              '    originalSetMinZoom?.(HEALTH_MAP_MIN_ZOOM);'
          )
          replace_once(
              'src/modules/map-guard.js',
              '  return Boolean(map.__agsusOverviewMode) && Number(map.getZoom?.() ?? 0) <= 4;',
              '  return (\n    Boolean(map.__agsusOverviewMode) &&\n    Number(map.getZoom?.() ?? 0) <= HEALTH_MAP_OVERVIEW_MAX_ZOOM\n  );'
          )
          replace_once(
              'src/modules/map-guard.js',
              '        maxZoom: 4,\n        animate: false,\n      });\n    }\n  });',
              '        maxZoom: HEALTH_MAP_OVERVIEW_MAX_ZOOM,\n        animate: false,\n      });\n    }\n  });'
          )

          # Testes de regressão: o guard não pode voltar a 3/4 e o satélite não
          # pede tiles nativos de níveis que geram a imagem de indisponibilidade.
          replace_once(
              'tests/map-base-layer-switcher.test.js',
              '    expect(source).toContain("export const MAP_MIN_ZOOM = 5");',
              '    expect(source).toContain("export const MAP_MIN_ZOOM = 4.5");'
          )
          replace_once(
              'tests/map-base-layer-switcher.test.js',
              '    expect(source).toContain("maxZoom: MAP_MAX_ZOOM");\n  });',
              '    expect(source).toContain("maxZoom: MAP_MAX_ZOOM");\n    expect(source).toContain("SATELLITE_MAX_NATIVE_ZOOM = 17");\n    expect(source).toContain("maxNativeZoom: SATELLITE_MAX_NATIVE_ZOOM");\n  });'
          )

          test_path = Path('tests/map-zoom-guard-regression.test.js')
          test_path.write_text('''import { readFileSync } from "node:fs";\nimport { describe, expect, it } from "vitest";\n\nconst guard = readFileSync("src/modules/map-guard.js", "utf8");\nconst switcher = readFileSync("src/modules/map-base-layer-switcher.js", "utf8");\n\ndescribe("faixa de zoom do mapa de Saude Indigena", () => {\n  it("mantem guard e switcher no mesmo limite de 500 km", () => {\n    expect(switcher).toContain("MAP_MIN_ZOOM = 4.5");\n    expect(guard).toContain("HEALTH_MAP_MIN_ZOOM = 4.5");\n    expect(guard).toContain("HEALTH_MAP_OVERVIEW_MAX_ZOOM = 4.5");\n    expect(guard).not.toContain("originalSetMinZoom?.(3)");\n    expect(guard).not.toContain("Math.min(requested, 3)");\n  });\n\n  it("nao pede imagem de satelite nativa acima do nivel estavel", () => {\n    expect(switcher).toContain("SATELLITE_MAX_NATIVE_ZOOM = 17");\n    expect(switcher).toContain("maxNativeZoom: SATELLITE_MAX_NATIVE_ZOOM");\n    expect(switcher).toContain("MAP_MAX_ZOOM = 19");\n  });\n});\n''')
          PY

          git diff --check

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/map-base-layer-switcher.js src/modules/map-guard.js tests/map-base-layer-switcher.test.js tests/map-zoom-guard-regression.test.js
          if git diff --cached --quiet; then
            echo "Patch already applied."
            exit 0
          fi
          git commit -m "fix(mapa): estabilizar zoom e tiles de satelite"
          git push origin HEAD:fix/mapa-zoom-sem-erro
