name: Temp Sync Nina Hotfix

on:
  push:
    branches:
      - fix/nina-observer-smoke

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: fix/nina-observer-smoke
          fetch-depth: 0
      - name: Sincronizar main atual
        run: |
          git fetch origin main
          git config user.name "Yassury Sousa Suira"
          git config user.email "yassury.suira@agenciasus.org.br"
          git merge --no-edit origin/main
          git push origin HEAD:fix/nina-observer-smoke
