name: Format Arara PR19

on:
  push:
    branches:
      - feat/arara-fala-sem-instalacao

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/arara-fala-sem-instalacao
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: npx prettier --write src/modules/arara-speaking-effects.js
      - name: Commit formatting
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/arara-speaking-effects.js
          if git diff --cached --quiet; then
            echo "Already formatted."
            exit 0
          fi
          git commit -m "style(arara): aplicar Prettier ao efeito de fala"
          git push origin HEAD:feat/arara-fala-sem-instalacao
