name: Format PR15 once

on:
  push:
    branches:
      - fix/analises-limpar-subtitulo-vaga

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/analises-limpar-subtitulo-vaga
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - name: Ajustar teste e formatar
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/analises-fila-visual.test.js')
          s = p.read_text()
          old = '''    expect(css).toContain(\n      ".table-wrap tbody tr:not(.detail-row)>td:nth-child(5) .secondary-text{display:none!important}",\n    );'''
          new = '''    expect(css).toContain(\n      ".table-wrap tbody tr:not(.detail-row) > td:nth-child(5) .secondary-text",\n    );\n    expect(css).toContain("display: none !important");'''
          if old not in s:
            raise SystemExit('expected test pattern not found')
          p.write_text(s.replace(old, new, 1))
          PY
          npx prettier --write src/analises/analises-infinite-table.css tests/analises-fila-visual.test.js
          rm .github/workflows/format-pr15.yml
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style(analises): formatar limpeza da fila"
          git push origin HEAD:fix/analises-limpar-subtitulo-vaga
