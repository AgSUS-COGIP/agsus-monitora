name: Temporary map smoke diagnostic

on:
  push:
    branches:
      - feat/mapa-lotacoes-precisas

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Executar smoke e capturar saída
        shell: bash
        run: |
          set +e
          npm run test:smoke > smoke-failure.txt 2>&1
          code=$?
          echo "exit_code=$code" >> smoke-failure.txt
          exit 0
      - name: Publicar diagnóstico na branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add smoke-failure.txt
          git commit -m "chore(ci): registrar diagnóstico temporário do smoke" || exit 0
          git push
