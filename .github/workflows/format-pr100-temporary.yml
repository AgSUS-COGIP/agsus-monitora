name: Temporary PR100 formatter

on:
  push:
    branches:
      - fix/aya-chat-quadro-unico

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Configurar Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Formatar arquivos
        run: npx prettier --write tests/arara-guide.test.js

      - name: Commitar formatacao
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Nenhuma alteracao necessaria."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/arara-guide.test.js
          git commit -m "style: aplicar Prettier"
          git push
