<!doctype html>
<html lang="pt-BR">
  <!--
    CONFERÊNCIA VISUAL DOS MAPAS — não faz parte da aplicação.

    Carrega o CSS compilado e os MÓDULOS REAIS (mapa-render, vinculos-territoriais)
    com dados sintéticos nos volumes reais, para conferir agrupamento, leque,
    selo de sede partilhada, tema escuro e foco de teclado sem precisar de login.

    Como correr:

      npm run build
      cp bench/conferencia-mapa.html dist/
      mkdir -p dist/src/lib dist/src/modules
      cp src/lib/mapa-render.js src/lib/uf-ibge.js src/lib/reconciliacao-unidades.js dist/src/lib/
      cp src/modules/vinculos-territoriais.js dist/src/modules/
      npx vite preview --port 4203

    e abrir http://127.0.0.1:4203/conferencia-mapa.html
  -->
  <head>
    <meta charset="utf-8" />
    <title>Conferência visual — mapas</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"
      integrity="sha512-h9FcoyWjHcOcmEVkxOfTLnmZFWIH0iZhZT1H2TbOq55xssQGEJHEaIm+PgoUaZbRvQTNTluNOEfb1ZRy6D3BOw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"
      integrity="sha512-puJW3E/qXDqYp9IfhAI54BJEaWIfloJ7JWs7OeD5i6ruC9JZL1gERT1wjtwXFlh7CjE7ZJ+/vcRZRkIYIb6p4g=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
    <script>
      fetch("/index.html")
        .then((r) => r.text())
        .then((h) => {
          const css = h.match(/\/assets\/main-[A-Za-z0-9_-]+\.css/)?.[0];
          if (!css) return;
          const l = document.createElement("link");
          l.rel = "stylesheet";
          l.href = css;
          document.head.appendChild(l);
        });
    </script>
    <style>
      body {
        margin: 0;
        padding: 14px;
        font:
          13px system-ui,
          sans-serif;
      }
      h2 {
        margin: 16px 0 6px;
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        opacity: 0.65;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <h2>Workspace — nacional (seletor) + detalhe (principal)</h2>
      <div class="health-map-workspace">
        <section class="health-map-pane health-map-pane--master">
          <div class="health-map-pane__header">
            <div>
              <span class="health-map-pane__eyebrow">Visão nacional</span>
              <h3>DSEIs / CASAIs do Brasil</h3>
            </div>
            <span class="health-map-pane__count">36 territórios</span>
          </div>
          <div id="map"></div>
          <div class="health-map-pane__hint">
            Clique num DSEI para abrir os polos.
          </div>
        </section>
        <section class="health-map-pane health-map-pane--detail">
          <div class="health-map-pane__header">
            <div>
              <span class="health-map-pane__eyebrow">Detalhamento</span>
              <h3>Mapa do DSEI Yanomami</h3>
            </div>
            <button type="button" class="health-map-reset">Voltar</button>
          </div>
          <div class="health-map-detail-layout">
            <div id="detailMap"></div>
            <section class="health-map-units">
              <div class="health-map-units__header">Unidades <b>1462</b></div>
              <div class="health-map-units__list">
                <button type="button" class="health-map-unit">
                  <span class="health-map-unit__icon">●</span>
                  <span
                    ><strong>Polo Base Xitei</strong
                    ><small>Polo base</small></span
                  >
                </button>
                <button type="button" class="health-map-unit">
                  <span class="health-map-unit__icon">⌂</span>
                  <span
                    ><strong>CASAI Boa Vista</strong
                    ><small>Casa de saúde indígena</small></span
                  >
                </button>
              </div>
            </section>
          </div>
          <div class="health-map-detail-legend"></div>
        </section>
      </div>
    </div>

    <script type="module">
      import {
        agruparPorCelula,
        posicoesSpiderfy,
        raioDaBolha,
      } from "/src/lib/mapa-render.js";
      import { htmlDaLegenda } from "/src/modules/vinculos-territoriais.js";

      document.querySelector(".health-map-detail-legend").innerHTML =
        htmlDaLegenda();

      const tiles = () =>
        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
          maxZoom: 18,
        });

      /* ---- Nacional: bolhas por raiz quadrada + selo de sede partilhada ---- */
      const nac = L.map("map", { attributionControl: false }).setView(
        [-12, -55],
        3,
      );
      tiles().addTo(nac);
      const dseis = [
        { n: "Yanomami", lat: 2.8235, lon: -60.6758, pop: 30000 },
        { n: "Leste de Roraima", lat: 2.8235, lon: -60.6758, pop: 18000 },
        { n: "Alto Rio Purus", lat: -9.02, lon: -68.66, pop: 12000 },
        { n: "Kaiapó do Mato Grosso", lat: -11.8, lon: -53.3, pop: 9000 },
        { n: "Potiguara", lat: -6.9, lon: -35.1, pop: 2000 },
      ];
      const popMax = Math.max(...dseis.map((d) => d.pop));
      [...dseis]
        .sort((a, b) => raioDaBolha(b.pop, popMax) - raioDaBolha(a.pop, popMax))
        .forEach((d) => {
          L.circleMarker([d.lat, d.lon], {
            radius: raioDaBolha(d.pop, popMax),
            color: "#1f6f4a",
            weight: 1.5,
            fillColor: "#0b8f58",
            fillOpacity: 0.7,
          })
            .bindTooltip(`<b>DSEI ${d.n}</b>`)
            .addTo(nac);
        });
      // Selo de sede partilhada, deslocado em pixels.
      const c = nac.latLngToLayerPoint([2.8235, -60.6758]);
      L.marker(nac.layerPointToLatLng(c.add(L.point(18, -18))), {
        icon: L.divIcon({
          className: "mapa-cluster mapa-cluster--sede",
          html: "<span>2</span>",
          iconSize: [22, 22],
          iconAnchor: [11, 11],
        }),
      })
        .bindTooltip(
          "<b>2 DSEIs nesta sede</b><br>Yanomami<br>Leste de Roraima",
        )
        .addTo(nac);

      /* ---- Detalhe: agrupamento + leque aberto nos 57 coincidentes ---- */
      const det = L.map("detailMap", { attributionControl: false }).setView(
        [3.4, -61.2],
        7,
      );
      tiles().addTo(det);

      const registos = [];
      for (let i = 0; i < 57; i++)
        registos.push({
          name: `UBSI Aldeia ${i + 1}`,
          lat: 4.596,
          lon: -60.168,
        });
      for (let i = 0; i < 24; i++)
        registos.push({
          name: `Polo ${i + 1}`,
          lat: 2.6 + Math.random() * 1.6,
          lon: -62.4 + Math.random() * 1.8,
        });

      const svg = (cor) =>
        `<span class="mapa-marcador"><svg viewBox="0 0 18 18" width="18" height="18"><circle cx="9" cy="9" r="6.4" fill="${cor}" stroke="#fff" stroke-width="1.6"/></svg></span>`;

      const grupos = agruparPorCelula(registos, (r) =>
        det.latLngToContainerPoint([r.lat, r.lon]),
      );
      grupos.forEach((g) => {
        if (g.unico) {
          L.marker([g.lat, g.lon], {
            icon: L.divIcon({
              className: "mapa-marcador-wrap",
              html: svg("#e49a1b"),
              iconSize: [18, 18],
              iconAnchor: [9, 9],
            }),
          }).addTo(det);
          return;
        }
        const coincidente = g.registros.every(
          (r) => r.lat === g.registros[0].lat && r.lon === g.registros[0].lon,
        );
        L.marker([g.lat, g.lon], {
          icon: L.divIcon({
            className: coincidente
              ? "mapa-cluster mapa-cluster--leque"
              : "mapa-cluster",
            html: `<span>${g.quantidade}</span>`,
            iconSize: [26, 26],
            iconAnchor: [13, 13],
          }),
          keyboard: true,
        })
          .bindTooltip(
            `<b>${g.quantidade} unidades</b><br><i>${coincidente ? "mesma coordenada — abre em leque" : "clique para aproximar"}</i>`,
          )
          .addTo(det);
      });

      // Leque aberto, para a captura: os 57 na mesma coordenada.
      const coincid = grupos.find((g) => g.quantidade > 20);
      if (coincid) {
        const centro = det.latLngToLayerPoint([coincid.lat, coincid.lon]);
        posicoesSpiderfy(coincid.quantidade).forEach((pos, i) => {
          const destino = det.layerPointToLatLng(
            centro.add(L.point(pos.x, pos.y)),
          );
          L.polyline([[coincid.lat, coincid.lon], destino], {
            color: "#4a6b80",
            weight: 1.2,
            opacity: 0.6,
            interactive: false,
          }).addTo(det);
          L.marker(destino, {
            icon: L.divIcon({
              className: "mapa-marcador-wrap",
              html: svg("#6d28d9"),
              iconSize: [18, 18],
              iconAnchor: [9, 9],
            }),
            keyboard: true,
            title: coincid.registros[i]?.name,
          }).addTo(det);
        });
      }

      setTimeout(() => {
        nac.invalidateSize();
        det.invalidateSize();
        window.__pronto = true;
      }, 400);
    </script>
  </body>
</html>
