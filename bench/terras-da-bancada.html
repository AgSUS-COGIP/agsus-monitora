<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Bancada das terras</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <link
      rel="stylesheet"
      href="/src/styles/indigenous-territories-layer.css"
    />
    <link rel="stylesheet" href="/src/styles/legenda-das-terras.css" />
    <style>
      :root {
        --line: #d7e5f2;
        --card: #ffffff;
        --muted: #5f6f86;
      }
      body {
        margin: 0;
        font-family: Inter, system-ui, sans-serif;
        color: #10243e;
        background: #f3f7fb;
      }
      .grade {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        padding: 10px;
      }
      .mapa {
        height: 620px;
        border: 1px solid #d7e5f2;
      }
      .legenda {
        padding: 6px 2px;
      }
      h2 {
        font-size: 13px;
        margin: 0 0 4px;
      }
    </style>
  </head>
  <body>
    <div class="grade">
      <section>
        <h2>Brasil inteiro (visão nacional)</h2>
        <div id="map" class="mapa"></div>
        <div id="legNac" class="legenda"></div>
      </section>
      <section>
        <h2>Alagoas / Pernambuco (recorte do print)</h2>
        <div id="detailMap" class="mapa"></div>
        <div id="legDet" class="legenda"></div>
      </section>
    </div>
    <script type="module">
      import { installIndigenousTerritoriesLayer } from "/src/modules/indigenous-territories-layer.js";
      import { montarLegendaDasTerras } from "/src/modules/legenda-das-terras.js";

      installIndigenousTerritoriesLayer();
      const base = () =>
        L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
          maxZoom: 19,
        });

      const nac = L.map("map", { zoomSnap: 0.25, zoomDelta: 0.5 });
      base().addTo(nac);
      nac.fitBounds([
        [-33.75, -73.99],
        [5.27, -32.42],
      ]);
      montarLegendaDasTerras(document.getElementById("legNac"), nac);

      const det = L.map("detailMap", { zoomSnap: 0.25, zoomDelta: 0.5 });
      base().addTo(det);
      det.fitBounds([
        [-9.75, -38.6],
        [-8.95, -37.35],
      ]);
      montarLegendaDasTerras(document.getElementById("legDet"), det);

      window.__bancada = { nac, det };
    </script>
  </body>
</html>
