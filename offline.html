<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#003b70" />
    <title>AgSUS Monitora — offline</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        background: #f4f7fa;
        color: #17324a;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        width: min(100%, 520px);
        padding: 32px;
        border: 1px solid rgba(0, 59, 112, 0.14);
        border-radius: 24px;
        background: #ffffff;
        box-shadow: 0 18px 50px rgba(0, 35, 69, 0.14);
      }

      h1 {
        margin: 0 0 12px;
        color: #003b70;
        font-size: clamp(1.65rem, 6vw, 2.35rem);
      }

      p {
        margin: 0 0 20px;
        line-height: 1.6;
      }

      button {
        min-height: 48px;
        padding: 0 20px;
        border: 0;
        border-radius: 14px;
        background: #005999;
        color: #ffffff;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Você está offline</h1>
      <p>
        O AgSUS Monitora não conseguiu acessar a rede. Conteúdos já abertos
        podem continuar disponíveis; dados protegidos e atualizações exigem
        conexão.
      </p>
      <button type="button" onclick="window.location.reload()">
        Tentar novamente
      </button>
    </main>
  </body>
</html>
