    <!--
      Marca da tela de acesso, aplicada ANTES do primeiro paint.

      `main.ts` é `type="module"`, portanto adiado: ele só roda depois de o HTML
      ser analisado, quando o navegador já pintou a tela com os padrões neutros
      do CSS. Aplicar a marca guardada ali produzia uma piscada visível a cada
      recarga — claro e neutro primeiro, escuro e institucional logo depois.

      Este script é síncrono e clássico de propósito: roda aqui, antes de o
      `<body>` existir. Por isso escreve as variáveis em `documentElement` e não
      em `#loginScreen`, que ainda não foi criado — variáveis CSS são herdadas,
      então `#loginScreen .login-card` já as resolve.

      A classe de contraste não pode vir daqui: a seção Login de
      `platform-shell.css` a exige no próprio elemento, em `#loginScreen.login-panel-dark`. Ela fica
      decidida nesta bandeira e é aplicada por um segundo script, logo depois do
      elemento — assim nenhum dos seletores existentes precisa ser duplicado.

      A chave, os nomes das variáveis e o limiar de luminância são os mesmos de
      `access-branding-cache.ts` e `access-branding.ts`. `tests/piscada-do-login.test.js`
      falha se as duas cópias se separarem.
    -->
    <script>
      (function aplicarMarcaAntesDoPrimeiroPaint() {
        try {
          var bruto = localStorage.getItem("agsus_monitora_access_branding_v1");
          if (!bruto) return;
          var marca = JSON.parse(bruto);
          if (!marca || typeof marca !== "object") return;

          var raiz = document.documentElement;
          var cor =
            typeof marca.panelColor === "string" ? marca.panelColor.trim() : "";
          if (/^#[0-9a-f]{6}$/i.test(cor)) {
            /*
              A variável vai na raiz porque é herdada: `#loginScreen .login-card`
              já a resolve, sem precisar da classe nem do elemento.
            */
            raiz.style.setProperty("--login-panel-color", cor);
            var r = parseInt(cor.slice(1, 3), 16);
            var g = parseInt(cor.slice(3, 5), 16);
            var b = parseInt(cor.slice(5, 7), 16);
            /*
              A classe, ao contrário, é exigida em `#loginScreen.login-panel-dark`
              (platform-shell.css). Fica guardada aqui e um script logo depois do
              elemento a aplica — assim nenhum seletor precisa ser duplicado.
            */
            /*
              O modo guardado tem precedência sobre a luminância: "claro" e
              "escuro" são escolha de identidade, "auto" volta a derivar.
            */
            var modo =
              typeof marca.textoModo === "string"
                ? marca.textoModo.trim().toLowerCase()
                : "auto";
            window.__agsusPainelEscuro =
              modo === "claro"
                ? true
                : modo === "escuro"
                  ? false
                  : (r * 299 + g * 587 + b * 114) / 1000 < 145;
          }
          /* O estilo do painel (sólido ou vidro): a classe vai com a outra. */
          window.__agsusPainelVidro = marca.painelEstilo === "vidro";
          /*
            A cor no vidro (0 a 90, em %) e o desfoque da arte (a tabela de
            DESFOQUE_DO_VIDRO_EM_PX em src/lib/contraste.ts), 13/11/2026.
          */
          if (/^(0|[1-9]0)$/.test(marca.vidroCor || ""))
            raiz.style.setProperty("--vidro-cor", marca.vidroCor + "%");
          var desfoques = { nenhum: 0, leve: 8, forte: 18 };
          if (
            Object.prototype.hasOwnProperty.call(desfoques, marca.vidroDesfoque)
          )
            raiz.style.setProperty(
              "--vidro-desfoque",
              desfoques[marca.vidroDesfoque] + "px",
            );

          var arte =
            typeof marca.backgroundUrl === "string"
              ? marca.backgroundUrl.trim()
              : "";
          if (arte) {
            raiz.style.setProperty(
              "--login-background-image",
              'url("' + arte.replace(/["\\]/g, "") + '")',
            );
            /*
              A medida da arte (proporção e cor da borda), se for desta arte:
              a arte já sai no lugar e o fundo da cor dela, sem piscar
              (13/11/2026; marca.ts mede e guarda quando a arte carrega).
            */
            if (marca.arteMedidaDe === arte) {
              if (/^\d+(\.\d+)?$/.test(marca.arteProporcao || ""))
                raiz.style.setProperty(
                  "--login-arte-proporcao",
                  marca.arteProporcao,
                );
              if (/^#[0-9a-f]{6}$/i.test(marca.arteCor || ""))
                raiz.style.setProperty("--login-arte-cor", marca.arteCor);
            }
            /*
              A arte pedida e decodificada aqui, antes do CSS (13/11/2026).
              Decodificada só na hora de pintar, ela entrava uns 230 ms depois
              do cartão, de uma vez (a "piscada" gravada em vídeo); entrando
              suave, a piscada ficou mais leve, mas ainda se via. Agora o
              cartão espera a arte (`arte-esperando`, até 600 ms) e os dois
              aparecem juntos: ao atualizar, o navegador segura a tela
              anterior até a nova ter conteúdo, e a troca não se vê. Se a arte
              passar dos 600 ms (`arte-atrasada`), o cartão aparece e a arte
              entra com transição quando ficar pronta (ou falhar, ou em 3 s).
            */
            raiz.classList.add("arte-esperando");
            var pronta = function () {
              raiz.classList.add("arte-pronta");
              raiz.classList.remove("arte-esperando");
            };
            var imagem = new Image();
            window.__agsusArteDoAcesso = imagem;
            imagem.src = arte;
            if (imagem.decode) imagem.decode().then(pronta, pronta);
            else imagem.onload = imagem.onerror = pronta;
            setTimeout(function () {
              if (raiz.classList.contains("arte-pronta")) return;
              raiz.classList.add("arte-atrasada");
              raiz.classList.remove("arte-esperando");
            }, 600);
            setTimeout(pronta, 3000);
          }
        } catch (erro) {
          /* Armazenamento bloqueado ou conteúdo inválido: fica o fundo neutro. */
        }
      })();
    </script>
    <!--
      Só no `npm run dev:frontend`. Lá o Vite injeta o CSS dos módulos pelo
      JavaScript, depois da primeira pintura; até isso acontecer só valia o
      app.css, e cada recarga mostrava uma tela de acesso antiga, sem estilo e
      sem o botão do Google. O Vite põe `/@vite/client` no <head> antes deste
      script, e esse é o sinal. No build de produção o CSS vem em <link> e nada
      disto se aplica. `src/main.ts` tira a classe depois dos imports de CSS.
    -->
    <style>
      html.vite-dev-carregando #loginScreen {
        visibility: hidden;
      }
    </style>
    <script>
      if (document.querySelector('script[src="/@vite/client"]'))
        document.documentElement.classList.add("vite-dev-carregando");
    </script>
    <!--
      Recarregar já logado não mostra a tela de acesso.

      Enquanto as configurações carregam (`body.config-loading`), app.css deixa
      a tela de acesso visível — é ela a tela de espera de quem ainda não
      entrou. Para quem já tem sessão guardada, isso piscava a tela de login,
      com a arte de fundo, a cada F5. Este script roda antes da primeira
      pintura: havendo sessão (`refresh_token` em `agsus-monitora-auth`, a
      chave de src/lib/env.ts), a espera vira o skeleton da entrada
      (`.esqueleto-da-entrada`, src/modules/carregamento.js), já no
      formato da última tela, com a barra aberta ou recolhida e no tema escuro
      de quem o escolheu. Se a sessão tiver expirado, o skeleton sai e o login
      aparece como sempre. `tests/recarga-logado.test.js` e
      `tests/esqueleto-da-entrada.test.js` cobrem as chaves e as regras.
    -->
    <style>
      html.sessao-guardada body.config-loading #loginScreen {
        display: none;
      }
    </style>
    <script>
      (function marcarSessaoGuardada() {
        try {
          var chave = "agsus-monitora-auth";
          var bruto =
            localStorage.getItem(chave) || sessionStorage.getItem(chave);
          var sessao = bruto && JSON.parse(bruto);
          if (
            !sessao ||
            typeof sessao.refresh_token !== "string" ||
            !sessao.refresh_token
          )
            return;
          var raiz = document.documentElement;
          raiz.classList.add("sessao-guardada", "esqueleto-ativo");
          // A mesma regra de src/lib/esqueleto-da-entrada.ts.
          var visao =
            localStorage.getItem("agsus_monitora_current_view_v268") || "";
          raiz.setAttribute(
            "data-esqueleto",
            visao === "calendario"
              ? "calendario"
              : !visao || visao === "dashboard" || visao.indexOf("panel:") === 0
                ? "painel"
                : "tabela",
          );
          if (
            localStorage.getItem("agsus_monitora_sidebar_collapsed_v1") === "0"
          )
            raiz.setAttribute("data-esqueleto-barra", "aberta");
          if (localStorage.getItem("agsus_dark_mode_v1") === "1")
            raiz.setAttribute("data-theme", "dark");
        } catch (erro) {
          /* Armazenamento bloqueado ou conteúdo inválido: fica a tela de acesso. */
        }
      })();
    </script>
